<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>鬧鬼山莊：背叛 LAN 玩家</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/styles/game-ui.css">
    <link rel="stylesheet" href="/player/styles.css">
  </head>
  <body data-role="player">
    <main class="ui-shell">
      <header class="ui-header">
        <p class="eyebrow">鬧鬼山莊：背叛 LAN MVP</p>
        <h1>玩家大廳</h1>
        <p class="ui-status" data-status aria-live="polite">正在連線到共享房間傳輸層…</p>
      </header>
      <section class="current-action" data-current-action aria-label="目前行動" aria-live="polite">
        <p class="current-action__label">目前行動</p>
        <div data-current-action-card></div>
        <div class="player-room-actions" aria-label="加入或重連房間">
          <button type="button" data-join-room>加入房間</button>
          <label for="reconnect-token">重連資訊</label>
          <input id="reconnect-token" data-reconnect-token type="text" autocomplete="off" inputmode="text">
          <button type="button" data-reconnect-room>使用重連資訊</button>
        </div>
        <p data-turn-summary>正在等待遊戲狀態。</p>
        <p data-location>目前位置：尚未加入</p>
        <p data-movement>尚無可移動位置</p>
        <p data-actions aria-label="遊戲操作" class="action-area"></p>
      </section>
      <section class="player-identity-bar" aria-label="玩家身份">
        <span class="status-badge" data-connection-badge>連線中</span>
        <span data-player-identity>尚未加入房間</span>
        <span data-player-revision>REV —</span>
      </section>
      <details class="paper-panel game-panel" aria-label="角色檔案">
        <summary>角色檔案</summary>
        <p data-character>尚未取得角色資料。</p>
      </details>
      <details class="paper-panel game-panel map-panel" aria-label="公開房間地圖" open>
        <summary>山莊探索地圖</summary>
        <p class="map-subtitle">公開版圖會隨伺服器狀態更新；其他玩家位置只顯示公開資訊。</p>
        <div class="room-map" data-map>尚未探索房間。</div>
      </details>
      <details class="state-details">
        <summary>查看房間傳輸狀態</summary>
        <pre data-state>目前尚未收到房間狀態。</pre>
      </details>
      <section class="paper-panel game-panel" aria-label="持有卡牌">
        <h2>持有卡牌</h2>
        <div data-cards>尚未持有卡牌。</div>
      </section>
      <section class="paper-panel game-panel" aria-label="待處理互動">
        <h2>待處理互動</h2>
        <p data-interaction>目前沒有待處理互動。</p>
      </section>
      <section class="paper-panel game-panel" aria-label="戰鬥結果">
        <h2>戰鬥結果</h2>
        <p data-combat>尚無戰鬥結果。</p>
      </section>
      <section class="paper-panel game-panel" aria-label="作祟狀態">
        <h2>作祟狀態</h2>
        <p data-haunt>尚未觸發作祟。</p>
      </section>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/player/app.js"></script>
  </body>
</html>
